name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: build-and-test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 1. Descargar el código (checkout)
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 3. Instalar dependencias (npm ci)
        run: npm ci

      - name: 4. Construcción - verificar sintaxis del servidor
        run: |
          node --check server.js
          node --check routes/users.js
          node --check models/user.js
          node --check utils/sanitizers.js

      - name: 5. Ejecutar pruebas automatizadas con cobertura
        run: npm test

      - name: 6. Generar reporte en el resumen del workflow
        if: always()
        run: |
          echo "## Reporte de CI - Node ${{ matrix.node-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rama: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage/lcov.info 2>/dev/null | grep -E "^(SF|LF|LH)" >> "$GITHUB_STEP_SUMMARY" || echo "Sin datos de cobertura" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 7. Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-node-${{ matrix.node-version }}
          path: coverage/
