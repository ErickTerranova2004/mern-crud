name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Empaquetar artefacto (.zip)
        run: git archive --format=zip --prefix=mern-crud-${{ github.ref_name }}/ -o mern-crud-${{ github.ref_name }}.zip HEAD

      - name: Publicar Release en GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "mern-crud-${{ github.ref_name }}.zip" \
            --title "Versión ${{ github.ref_name }}" \
            --notes-file CHANGELOG.md
